version: "3.8"

services:
  web:
    image: jitsi/web:stable
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - prosody
      - jicofo
      - jvb

    networks:
      meet.jitsi:

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jitsi.rule=Host(`eway-meet.studentplus2.in`)"
      - "traefik.http.routers.jitsi.entrypoints=websecure"
      - "traefik.http.routers.jitsi.tls.certresolver=letsencrypt"
      - "traefik.http.services.jitsi.loadbalancer.server.port=80"

    volumes:
      - ${CONFIG}/web:/config
      - ${CONFIG}/web/letsencrypt:/etc/letsencrypt
      - ${CONFIG}/web/config.js:/config.js
      - ${CONFIG}/web/interface_config.js:/interface_config.js
      - ${CONFIG}/web/watermark.svg:/usr/share/jitsi-meet/images/watermark.svg
      - ${CONFIG}/web/logo.png:/usr/share/jitsi-meet/images/logo.png

  prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped

    env_file:
      - .env

    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi
          - auth.meet.jitsi
          - muc.meet.jitsi
          - internal-muc.meet.jitsi

    volumes:
      - ${CONFIG}/prosody:/config
      - ${CONFIG}/prosody/plugins:/prosody-plugins-custom

  jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - prosody

    networks:
      meet.jitsi:

    volumes:
      - ${CONFIG}/jicofo:/config

  jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - prosody

    ports:
      - "10000:10000/udp"
      - "4443:4443/tcp"

    networks:
      meet.jitsi:

    volumes:
      - ${CONFIG}/jvb:/config

networks:
  meet.jitsi:
    driver: bridge